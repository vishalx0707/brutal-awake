[package]
name = "brutal-awake"
version = "1.0.0"
description = "Keep your laptop awake — even with the lid closed."
authors = ["vishalx0707"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_System_Threading", "Win32_Security", "Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
