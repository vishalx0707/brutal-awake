<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brutal Awake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }

  :root {
    /* Real Apple SF Pro. 'SF Pro Text' is the optical variant for UI text
       ≤19pt (Apple switches to 'SF Pro Display' at 20pt+). -apple-system
       resolves to SF on Apple devices; the named families resolve to the
       installed Apple fonts on Windows. Segoe kept only as last-ditch. */
    --sf: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro',
          'SF Pro Display', 'Segoe UI Variable Text', 'Segoe UI',
          system-ui, sans-serif;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--sf);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'ss01', 'cv01';
    background: #0b0b0d;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  /* ================================================================
     NEUTRAL LIGHT FIELD — soft grayscale luminance the glass refracts.
     No color: just slow-moving light and dark so the glass has edges
     and texture to bend, like Apple glass over a monochrome wallpaper.
     ================================================================ */
  .aurora { position: fixed; inset: -30%; }
  .aurora .blob {
    position: absolute;
    width: 55vmax; height: 55vmax;
    border-radius: 50%;
    filter: blur(60px);
    will-change: transform;
  }
  .blob.b1 { background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, transparent 62%); top: -8%;  left: -12%; animation: drift1 26s ease-in-out infinite alternate; }
  .blob.b2 { background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 62%); bottom: -14%; right: -16%; animation: drift2 31s ease-in-out infinite alternate; }
  .blob.b3 { background: radial-gradient(circle, rgba(255,255,255,0.13) 0%, transparent 62%); top: 34%; left: 26%; animation: drift3 23s ease-in-out infinite alternate; }
  .blob.b4 { background: radial-gradient(circle, rgba(0,0,0,0.5) 0%, transparent 60%); top: 55%; left: -10%; animation: drift2 37s ease-in-out infinite alternate-reverse; }

  @keyframes drift1 { from { transform: translate(0,0) scale(1); }    to { transform: translate(16vmax, 10vmax) scale(1.15); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1.1); }  to { transform: translate(-14vmax, -8vmax) scale(0.95); } }
  @keyframes drift3 { from { transform: translate(0,0) scale(0.9); }  to { transform: translate(10vmax, -12vmax) scale(1.2); } }

  /* ================================================================
     GLASS DRESSING — the recipe that makes a translucent panel read as
     real glass (tint gradient + inset highlights + drop shadow).
     Refraction itself is applied by liquid-glass.js via backdrop-filter.
     ================================================================ */
  .glass {
    background: linear-gradient(180deg, rgba(14,14,22,0.18), rgba(14,14,22,0.32));
    box-shadow:
      0 24px 60px rgba(0,0,0,0.45),
      inset 0 1px 1px rgba(255,255,255,0.5),
      inset 0 -8px 20px rgba(255,255,255,0.06),
      inset 0 0 0 1px rgba(255,255,255,0.13);
  }

  /* ================================================================
     GLASS CARD
     ================================================================ */
  .card {
    position: relative;
    width: 340px;
    height: 460px;
    border-radius: 44px;
    padding: 44px 32px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 44px;
    color: #fff;
  }

  /* ================================================================
     POWER RING — big circular glass indicator
     ================================================================ */
  .ring {
    position: relative;
    width: 148px; height: 148px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: box-shadow 0.6s ease;
  }
  body.on .ring {
    box-shadow:
      0 24px 60px rgba(0,0,0,0.45),
      0 0 46px rgba(255,255,255,0.25),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 0 0 1px rgba(255,255,255,0.3);
  }
  .ring svg {
    width: 56px; height: 56px;
    stroke: rgba(255,255,255,0.85);
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.35));
    transition: stroke 0.6s ease, filter 0.6s ease;
  }
  body.on .ring svg {
    stroke: #ffffff;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.85));
  }

  /* ================================================================
     GLASS TOGGLE BUTTON (pill)
     ================================================================ */
  .glass-btn {
    position: relative;
    width: 264px; height: 58px;
    border: none; border-radius: 29px;
    cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    /* SF Pro Text, 17px Semibold, Apple's exact 17pt tracking (−26/1000 em).
       No text-shadow — clean and minimal, like Apple's own UI. */
    font-size: 17px; font-weight: 600; letter-spacing: -0.026em;
    transition: transform 0.18s cubic-bezier(0.32,0.72,0,1), box-shadow 0.5s ease, background 0.6s ease;
  }
  .glass-btn:hover  { transform: translateY(-1px) scale(1.012); }
  .glass-btn:active { transform: translateY(0) scale(0.975); }
  body.on .glass-btn {
    background: linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0.12));
    box-shadow:
      0 24px 60px rgba(0,0,0,0.45),
      0 0 30px rgba(255,255,255,0.2),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 0 0 1px rgba(255,255,255,0.22);
  }
</style>
</head>
<body>

  <div class="aurora">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
  </div>

  <!-- Glass card -->
  <div class="card glass" id="card">
    <div class="ring glass" id="ring">
      <!-- SF Symbols–style power glyph -->
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <path d="M12 3v8"/>
        <path d="M6.2 6.2a8.2 8.2 0 1 0 11.6 0"/>
      </svg>
    </div>

    <button class="glass-btn glass" id="toggleBtn" type="button">
      <span id="btnLabel">Turn On</span>
    </button>
  </div>

  <script src="liquid-glass.js"></script>
  <script>
    // Apply the real Apple-style refraction to each glass element.
    // Tuned defaults from the module; ring gets a stronger bulge for the lens look.
    liquidGlass(document.getElementById('card'), { scale: -96, chroma: 6, blur: 4, radius: 44 });
    liquidGlass(document.getElementById('ring'), { scale: -150, chroma: 10, blur: 2 });
    liquidGlass(document.getElementById('toggleBtn'), { scale: -112, chroma: 6, blur: 3, radius: 29 });

    const btn = document.getElementById('toggleBtn');
    const btnLabel = document.getElementById('btnLabel');
    let busy = false;

    function render(on) {
      document.body.classList.toggle('on', on);
      btnLabel.textContent = on ? 'Turn Off' : 'Turn On';
    }

    async function refresh() {
      try { render((await (await fetch('/api/state')).json()).on); } catch (e) {}
    }

    btn.addEventListener('click', async () => {
      if (busy) return;
      busy = true;
      try { render((await (await fetch('/api/toggle', { method: 'POST' })).json()).on); } catch (e) {}
      busy = false;
    });

    // Restore power settings + exit when the window closes.
    window.addEventListener('pagehide', () => navigator.sendBeacon('/api/quit'));

    refresh();
  </script>
</body>
</html>
