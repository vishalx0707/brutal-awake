<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brutal Awake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }

  :root {
    --paper: #f7f6f2;          /* warm paper white */
    --ink:   #111111;          /* near-black ink   */
    --muted: #8c8a83;          /* grey label ink   */
    --hair:  #dedcd4;          /* hairline rule    */
    --track-off: #d3d1c9;      /* neutral grey track */
    --font: "Helvetica Neue", "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    border-radius: 14px;
  }

  body {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    cursor: default;
  }

  /* Extremely subtle paper grain — inline SVG, CSP-safe (no external assets). */
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    opacity: 0.05; mix-blend-mode: multiply;
  }

  /* ================================================================
     TITLE BAR — drag region + window controls (top-right)
     ================================================================ */
  .titlebar {
    height: 40px; flex: 0 0 40px; z-index: 20;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 6px 8px 0; gap: 2px;
  }
  .win-btn {
    width: 30px; height: 26px; border: none; background: transparent; border-radius: 6px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: background 0.15s ease, color 0.15s ease;
  }
  .win-btn:hover { background: rgba(17,17,17,0.06); color: var(--ink); }
  .win-btn.close:hover { background: rgba(17,17,17,0.06); color: #c0392b; }
  .win-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

  /* ================================================================
     CONTENT — label / hairline / status word / toggle
     ================================================================ */
  .content {
    flex: 1; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 40px 34px;
  }

  .label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--muted);
  }

  .rule {
    width: 34px; height: 1px; background: var(--hair);
    margin: 20px 0 26px;
  }

  .status {
    font-size: 46px; font-weight: 600; letter-spacing: -0.03em; line-height: 1;
    color: var(--ink);
    transition: opacity 0.2s ease;
  }
  body:not(.on) .status { color: var(--muted); }

  .switch-wrap { margin-top: 46px; }

  /* ================================================================
     TOGGLE SWITCH — flat, monochrome (grey off, ink on)
     ================================================================ */
  .switch {
    --w: 66px; --h: 34px; --pad: 4px; --thumb: 26px;
    position: relative;
    width: var(--w); height: var(--h);
    border: none; padding: 0; cursor: pointer; outline: none;
    border-radius: calc(var(--h) / 2);
    background: var(--track-off);
    -webkit-tap-highlight-color: transparent;
    transition: background 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body.on .switch { background: var(--ink); }
  .switch:focus-visible { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }

  .switch__thumb {
    position: absolute; top: var(--pad); left: var(--pad);
    width: var(--thumb); height: var(--thumb);
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.22), 0 1px 1px rgba(0,0,0,0.10);
    transform: translateX(0);
    transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body.on .switch__thumb {
    transform: translateX(calc(var(--w) - var(--thumb) - var(--pad) * 2));
  }
  .switch:active .switch__thumb { width: calc(var(--thumb) + 3px); }
</style>
</head>
<body>
  <!-- Paper grain texture (procedural, inline SVG — no external assets). -->
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#paper-grain)"/>
  </svg>

  <!-- Window controls (top-right) -->
  <div class="titlebar" data-tauri-drag-region>
    <button class="win-btn" id="btnMin" title="Minimize" aria-label="Minimize">
      <svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg>
    </button>
    <button class="win-btn" id="btnMax" title="Maximize" aria-label="Maximize">
      <svg viewBox="0 0 12 12"><rect x="2.4" y="2.4" width="7.2" height="7.2" rx="1.4"/></svg>
    </button>
    <button class="win-btn close" id="btnClose" title="Close" aria-label="Close">
      <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="label">Brutal Awake</div>
    <div class="rule"></div>
    <div class="status" id="statusTitle">AWAKE</div>

    <div class="switch-wrap">
      <button class="switch" id="toggleBtn" type="button" role="switch" aria-checked="true" aria-label="Keep awake">
        <span class="switch__thumb"></span>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
